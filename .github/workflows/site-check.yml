name: Website publication checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        brand: [company, backdoor-map]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-production.mjs ${{ matrix.brand }}
